<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Extensions · Qabas</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202b3d; background: #f8faff; font-size: 14px; --muted: #596980; --line: #dee5ef; --panel: #fff; --blue: #315fec; }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body { margin: 0; }
      main { max-width: 820px; padding: 32px; margin: auto; }
      header { display: flex; gap: 14px; align-items: center; margin-bottom: 30px; }
      h1 { font-size: 24px; margin: 0; letter-spacing: -.6px; }
      h2 { font-size: 17px; margin: 0; }
      h3 { font-size: 16px; margin: 0; }
      p { line-height: 1.65; }
      .muted, dt { color: var(--muted); }
      header p { margin: 5px 0 0; }
      .section-title { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      button { font: inherit; color: var(--blue); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 13px; cursor: pointer; }
      button:disabled { opacity: .55; cursor: default; }
      :is(button, summary, input, select):focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
      .agent { padding: 21px; margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
      @media (min-width: 700px) { #agents { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .agent dl { grid-template-columns: 1fr; gap: 3px; } .agent dd { margin-bottom: 7px; } }
      .agent-heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .badge { font-size: 12px; color: var(--muted); background: #ecf0f7; padding: 5px 9px; border-radius: 5px; }
      .badge[data-state="runnable"] { color: #1b6945; background: #e4f4eb; }
      dl { display: grid; grid-template-columns: 125px 1fr; gap: 9px 15px; margin: 18px 0 0; line-height: 1.5; }
      dd { margin: 0; overflow-wrap: anywhere; }
      .path { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .notice { border-left: 3px solid var(--blue); padding: 0 0 0 13px; margin: 22px 0; color: var(--muted); }
      #progress { min-height: 23px; margin: 10px 0 0; color: var(--muted); }
      #error { color: #ae3030; }
      details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
      summary { cursor: pointer; color: var(--blue); }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 12px; background: #f0f3f9; border-radius: 6px; user-select: all; }
      .catalog { margin-top: 30px; }
      .catalog p { margin-bottom: 0; }
      .opt-ins { display: flex; gap: 22px; flex-wrap: wrap; margin: 16px 0; }
      label { display: flex; align-items: center; gap: 8px; }
      input { accent-color: var(--blue); width: 16px; height: 16px; }
      .toolbar, .filters, .save-actions { display: flex; align-items: center; gap: 10px; }
      .toolbar { margin-bottom: 16px; }
      #search { flex: 1; min-width: 0; width: auto; height: 38px; padding: 9px 12px; }
      #search, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
      select { padding: 8px; max-width: 100%; }
      .filters { flex-wrap: wrap; margin-bottom: 24px; }
      .filters label { margin-left: auto; }
      [aria-pressed="true"] { background: var(--blue); color: var(--panel); border-color: var(--blue); }
      .agent:has(input:checked) { border-color: var(--blue); }
      .agent { min-width: 0; align-self: start; }
      .description { color: var(--muted); min-height: 46px; }
      .choice { margin: 17px 0 0; font-size: 13px; }
      .choice input { flex-shrink: 0; }
      .save-bar { position: sticky; bottom: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 22px; }
      .save-actions { justify-content: space-between; flex-wrap: wrap; }
      .save-actions p { margin: 0; flex: 1; min-width: 160px; }
      #save { background: var(--blue); color: var(--panel); border-color: var(--blue); }
      #saved:empty { display: none; }
      #saved { margin: 12px 0 0; }
      #empty { text-align: center; padding: 35px 12px; }
      .catalog { font-size: 12px; }
      .view-tabs { display: flex; gap: 10px; margin-bottom: 24px; }
      .skill-actions { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
      .skill-preview pre { max-height: 260px; overflow: auto; user-select: text; }
      .skill-message { overflow-wrap: anywhere; }
      @media (max-width: 560px) { main { padding: 22px; } dl { grid-template-columns: 1fr; gap: 3px; } dd { margin-bottom: 8px; } }
      @media (prefers-color-scheme: dark) {
        :root { color: #e3eaf5; background: #111722; --muted: #a2afc4; --line: #303b4c; --panel: #1a2230; --blue: #8aa8ff; }
        .badge, pre { background: #263246; }
        .badge[data-state="runnable"] { color: #98dfb8; background: #203c30; }
        #error { color: #ff9d9d; }
      }
    </style>
  </head>
  <body>
    <main>
      <header><img src="icon.svg" width="42" height="42" alt="" /><div><h1 data-copy="title"></h1><p class="muted" data-copy="subtitle"></p></div></header>
      <div class="view-tabs"><button id="agents-tab" data-copy="agentTab" aria-pressed="true"></button><button id="skills-tab" data-copy="skillTab" aria-pressed="false"></button></div>
      <div id="agent-view">
      <div class="toolbar"><input id="search" type="search" /><button id="check" data-copy="check" disabled></button></div>
      <div class="filters">
        <button id="browse" data-copy="browse" aria-pressed="true"></button><button id="selected" data-copy="selected" aria-pressed="false"></button>
        <label><span data-copy="type"></span><select id="category"><option value="all" data-copy="all"></option><option value="sdk" data-copy="sdk"></option><option value="acp" data-copy="acp"></option></select></label>
      </div>
      <section aria-labelledby="local-heading">
        <div class="section-title"><h2 id="local-heading" data-copy="local"></h2><span id="results" class="muted" role="status"></span></div>
        <p id="progress" role="status" aria-live="polite" data-copy="idle"></p>
        <p id="error" role="alert" hidden></p>
        <div id="agents"></div>
        <div id="empty" hidden><p data-copy="empty"></p><button id="clear" data-copy="clear"></button></div>
      </section>
      <section class="save-bar" aria-label="Preferences">
        <div class="save-actions"><p id="selection" class="muted"></p><button id="reset" data-copy="reset" disabled></button><button id="save" data-copy="save" disabled></button></div>
        <p id="saved" role="status" aria-live="polite"></p>
      </section>
      <p class="notice" data-copy="enableHelp"></p>
      </div>
      <section id="skill-view" hidden aria-labelledby="skill-heading">
        <div class="section-title"><h2 id="skill-heading" data-copy="skillHeading"></h2><button id="skill-refresh" data-copy="skillRefresh"></button></div>
        <p class="notice" data-copy="skillRisk"></p>
        <p id="skill-status" role="status"></p>
        <div id="skills"></div>
      </section>
      <section class="catalog" aria-labelledby="catalog-heading">
        <h2 id="catalog-heading" data-copy="catalog"></h2>
        <p class="muted" data-copy="catalogBody"></p>
      </section>
    </main>

          choice.addEventListener('change', () => { saved.textContent = ''; refresh() })

          }
          const details = element('details')
          details.append(element('summary', t('setup')), data, element('p', t('boundary'), 'muted'), element('p', t(entry.transport === 'sdk' ? 'sdkInstall' : 'install'), 'muted'), element('pre', entry.docs), element('p', t('terminal'), 'muted'), element('pre', entry.login), element('p', t('source'), 'muted'), element('pre', entry.source))

      document.querySelector('#category').addEventListener('change', filter)
      document.querySelector('#browse').addEventListener('click', () => { selectedOnly = false; filter() })

          original = value
          saved.textContent = t('saved')
        } catch (error) {
          const category = typeof error === 'string' ? error.split(':')[0] : ''
          saved.textContent = t(category === 'agent-not-installed' ? 'missingAgent' : category === 'agent-shim-unsupported' ? 'unsupportedShim' : 'saveFailed')
        }
        finally { busy = false; refresh() }
      })
      document.querySelector('#check').addEventListener('click', async () => {
        const button = document.querySelector('#check')
        const progress = document.querySelector('#progress')
        const error = document.querySelector('#error')
        busy = true
        refresh()
        button.textContent = t('checking')
        progress.textContent = t('checking')
        error.hidden = true
        try {
          const agents = await window.__TAURI__.core.invoke('desktop_local_agents')
          for (const agent of agents) {
            const card = cards.get(agent.id)
            card.badge.textContent = t(agent.state)
            card.badge.dataset.state = agent.state
            card.fields.version.textContent = agent.version || '—'
            card.fields.path.textContent = agent.executable || '—'
            card.fields.runtimeSource.textContent = t(agent.runtimeSource)
            card.fields.auth.textContent = t(agent.auth)
          }
          progress.textContent = t('done')
        } catch {
          progress.textContent = ''
          error.textContent = t('failure')
          error.hidden = false
        } finally {
          busy = false
          refresh()
          button.textContent = t('check')
        }
      })
      let skillBusy = false
      let skillLoaded = false
      function lockSkills(value) {
        skillBusy = value
        document.querySelector('#skill-refresh').disabled = value
        for (const control of document.querySelectorAll('#skills button, #skills input')) control.disabled = value
      }
      async function loadSkills() {
        if (skillBusy) return
        lockSkills(true)
        const status = document.querySelector('#skill-status')
        status.textContent = t('skillWaiting')
        try {
          const listings = await window.__TAURI__.core.invoke('desktop_skill_catalog')
          document.querySelector('#skills').replaceChildren()
          for (const entry of listings) renderSkill(entry)
          skillLoaded = true
          status.textContent = ''
        } catch { status.textContent = t('skillLoadFailed') }
        finally { lockSkills(false) }
      }
      function renderSkill(entry) {
        const card = element('article', undefined, 'agent')
        card.setAttribute('aria-label', entry.name)
        const state = element('p', t(entry.state), 'badge')
        const details = element('details')
        details.append(element('summary', t('skillFiles')), element('pre', entry.files.map(file => `${file.name}\n${file.sha256}`).join('\n\n')))
        const actions = element('div', undefined, 'skill-actions')
        const preview = element('button', t('skillPreview'))
        const remove = element('button', t('skillRemove'))
        actions.append(preview, remove)
        const review = element('div', undefined, 'skill-preview')
        const confirmation = element('div')
        const message = element('p', undefined, 'skill-message')
        message.setAttribute('role', 'status')
        card.append(element('h3', entry.name), element('p', entry.summary[language], 'muted'), element('p', `${entry.author} · ${entry.license}`), state, element('p', t('skillVersion')), element('pre', entry.revision), element('pre', `https://github.com/${entry.repository}/tree/${entry.revision}/skills/${entry.id}`), details, actions, review, confirmation, message)
        document.querySelector('#skills').append(card)
        function updateActions() {
          remove.hidden = entry.state !== 'installed'
          for (const install of review.querySelectorAll('button')) install.hidden = entry.state !== 'not-installed'
        }
        async function operate(action) {
          if (skillBusy) return
          lockSkills(true)
          message.textContent = t('skillWaiting')
          try {
            const result = await window.__TAURI__.core.invoke('desktop_skill_action', { id: entry.id, revision: entry.revision, action })
            entry.state = result.state
            state.textContent = t(result.state)
            confirmation.replaceChildren()
            if (action === 'preview') {
              review.replaceChildren()
              for (const [name, body] of Object.entries(result.content)) {
                const file = element('details')
                file.open = name === 'SKILL.md'
                file.append(element('summary', name), element('pre', body))
                review.append(file)
              }
              const consent = element('input')
              consent.type = 'checkbox'
              const label = element('label', undefined, 'choice')
              label.append(consent, document.createTextNode(t('skillConsent')))
              const install = element('button', t('skillInstall'))
              install.hidden = true
              consent.addEventListener('change', () => { install.hidden = !consent.checked || entry.state !== 'not-installed' })
              install.addEventListener('click', () => { if (consent.checked) void operate('install') })
              review.append(label, install)
              message.textContent = ''
            } else {
              review.replaceChildren()
              message.textContent = action === 'install' ? t('skillInstalled') : `${t('skillRemoved')} ${result.recovery}`
            }
          } catch { message.textContent = t('skillFailed') }
          finally { lockSkills(false); remove.hidden = entry.state !== 'installed' }
        }
        preview.addEventListener('click', () => { void operate('preview') })
        remove.addEventListener('click', () => {
          confirmation.replaceChildren(element('p', t('skillRemoveHelp')))
          const confirm = element('button', t('skillConfirmRemove'))
          const cancel = element('button', t('skillCancel'))
          confirm.addEventListener('click', () => { void operate('uninstall') })
          cancel.addEventListener('click', () => confirmation.replaceChildren())
          confirmation.append(confirm, cancel)
        })
        updateActions()
      }
      document.querySelector('#skill-refresh').addEventListener('click', () => { void loadSkills() })
      for (const kind of ['agents', 'skills']) {
        document.querySelector(`#${kind}-tab`).addEventListener('click', () => {
          const skills = kind === 'skills'
          document.querySelector('#agent-view').hidden = skills
          document.querySelector('#skill-view').hidden = !skills
          document.querySelector('#agents-tab').setAttribute('aria-pressed', String(!skills))
          document.querySelector('#skills-tab').setAttribute('aria-pressed', String(skills))
          if (skills && !skillLoaded) void loadSkills()
        })
      }
    </script>
  </body>
</html>
