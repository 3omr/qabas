<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Qabas</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182230;
        background: #f4f7fb;
      }
      @media (prefers-color-scheme: dark) {
        :root { color: #f5f7fa; background: #101318; }
        .card { background: #171b22 !important; border-color: #2a303a !important; }
        .muted { color: #9ba7b5 !important; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      .card {
        width: min(420px, calc(100vw - 48px));
        padding: 36px;
        text-align: center;
        border: 1px solid #e1e7ef;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 60px rgb(19 33 55 / 10%);
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 650; }
      .muted { margin: 10px 0 0; color: #657386; font-size: 14px; line-height: 1.6; }
      .spinner {
        width: 22px;
        height: 22px;
        margin: 24px auto 0;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin .8s linear infinite;
        opacity: .65;
      }
      #error { display: none; color: #c23838; white-space: pre-wrap; }
      .actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; }
      button { font: inherit; cursor: pointer; padding: 9px 12px; border: 1px solid #8994a4; border-radius: 8px; background: transparent; color: inherit; }
      button:focus-visible { outline: 2px solid #4b8cff; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="icon.svg" width="48" height="48" alt="" />
      <h1>Qabas</h1>
      <p id="status" class="muted">Starting the local agent runtime…</p>
      <p id="error" class="muted"></p>
      <div id="spinner" class="spinner" aria-label="Loading"></div>
      <div class="actions">
        <button id="retry" hidden>Retry</button>
        <button id="diagnostics">Export diagnostics</button>
      </div>
    </main>
    <script>
      const chinese = navigator.language.toLowerCase().startsWith('zh')
      const status = document.querySelector('#status')
      const error = document.querySelector('#error')
      const spinner = document.querySelector('#spinner')
      const retry = document.querySelector('#retry')
      const diagnostics = document.querySelector('#diagnostics')
      document.documentElement.lang = chinese ? 'zh-CN' : 'en'
      status.setAttribute('role', 'status')
      error.setAttribute('role', 'alert')
      status.textContent = chinese ? '正在启动本地智能体…' : 'Starting the local agent runtime…'
      retry.textContent = chinese ? '重试' : 'Retry'
      diagnostics.textContent = chinese ? '导出诊断' : 'Export diagnostics'
      for (const [button, action] of [[retry, 'retry'], [diagnostics, 'diagnostics']]) {
        button.addEventListener('click', async () => {
          try {
            await window.__TAURI__.core.invoke('desktop_recovery', { action })
          } catch (reason) {
            error.textContent = String(reason)
            error.style.display = 'block'
          }
        })
      }
      addEventListener('dsh-desktop-runtime-starting', (event) => {
        status.textContent = chinese ? `正在启动（第 ${event.detail}/3 次）…` : `Starting (attempt ${event.detail}/3)…`
        error.style.display = 'none'
        spinner.style.display = 'block'
        retry.hidden = true
      })
      addEventListener('dsh-desktop-runtime-error', (event) => {
        status.textContent = chinese ? '本地智能体启动失败，可重试或导出诊断。' : 'The local runtime could not start. Retry or export diagnostics.'
        error.textContent = event.detail
        error.style.display = 'block'
        spinner.style.display = 'none'
        retry.hidden = false
      })
    </script>
  </body>
</html>
