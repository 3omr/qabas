<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
	<!-- قَبَس: two quotation marks that are also two flames. From the whole
	     lecture (the faded mark) it lifts the part worth keeping (the bright
	     one). Same geometry as QabasSymbol in ui-brand-qabas. -->
	<style>
		.tile { fill: #A9521A; }
		.flame { fill: #FBF8F4; }
		@media (prefers-color-scheme: dark) {
			.tile { fill: #EB9355; }
			.flame { fill: #15110E; }
		}
	</style>
	<rect class="tile" width="64" height="64" rx="15" />
	<path class="flame" opacity="0.55" transform="translate(-20 0)" d="M42 50a9 9 0 0 1-9-9c0-9.5 7-16 12.5-25.5 1.5 4.5 1 8-1 11.5 4.3 2.5 6.5 7.8 6.5 13a9 9 0 0 1-9 10z" />
	<path class="flame" d="M42 50a9 9 0 0 1-9-9c0-9.5 7-16 12.5-25.5 1.5 4.5 1 8-1 11.5 4.3 2.5 6.5 7.8 6.5 13a9 9 0 0 1-9 10z" />
</svg>
