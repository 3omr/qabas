version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 1
    groups:
      npm-version-updates:
        patterns:
          - "*"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 1
    groups:
      github-actions-version-updates:
        patterns:
          - "*"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
