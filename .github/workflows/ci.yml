name: CI

# The upstream repository uses private larger-runner and self-hosted pools that
# are not available to an independent community distribution. Keep one
# portable, keyless gates on GitHub-hosted Linux; the separate Desktop
# workflow owns target-native macOS and Windows packaging.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  validation:
    name: community / keyless
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Standard hosted runners have fewer cores than the upstream enterprise
      # pools. Bound the aggregate and its heaviest nested test schedulers.
      DSH_GATE_CONCURRENCY: '2'
      DSH_COVERAGE_MAX_WORKERS: '2'
      DSH_OXLINT_THREADS: '2'
      DSH_SNAPSHOT_MAX_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Verify community workflow policy
        run: pnpm exec vitest run scripts/ci-workflow.spec.ts

      - name: Run portable keyless checks
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          pnpm run check:ci:static
          pnpm run check:ci:artifacts
          pnpm run check:ci:lint:contracts-ready
          pnpm run check:node-compat

      - name: Install desktop replay browser
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium

      - name: Replay desktop Web composition
        env:
          DSH_SNAPSHOT: replay
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/desktop-context.e2e.ts apps/web/tests/desktop-loading.e2e.ts
