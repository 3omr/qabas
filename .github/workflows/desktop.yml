name: Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'apps/**'
      - 'engine/**'
      - 'packages/**'
      - 'vendor/**'
      - 'native/**'
      - 'patches/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
  push:
    tags:
      - 'desktop-v*'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            artifact: harness-desktop-macos-arm64
          - target: windows-x64
            runner: windows-2025
            artifact: harness-desktop-windows-x64
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches the application version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: pnpm exec tsx scripts/verify-desktop-release.ts "${{ github.ref_name }}"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build target-native transcription engine
        shell: bash
        run: |
          python -m pip install -r engine/requirements-build.txt
          pnpm run engine:build

      - name: Build application and bundled runtime
        run: pnpm run desktop:prepare

      - name: Verify reviewed marketplace artifacts without executing package code
        run: pnpm marketplace:verify apps/desktop/resources/runtime/marketplace

      - name: Verify bundled runtime and desktop authentication
        run: pnpm run desktop:smoke

      - name: Install plugin smoke browser
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium

      - name: Verify external plugin install and browser activation
        run: pnpm run desktop:smoke:plugins

      - name: Verify marketplace discovery and next-launch commands
        env:
          DSH_SNAPSHOT: replay
        run: pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/bundle-marketplace.e2e.ts apps/web/tests/focus-timer.e2e.ts

      - name: Test marketplace and preparation services
        run: pnpm exec vitest run packages/desktop/bundle-marketplace/tests packages/desktop/bundle-preparation/tests packages/desktop/focus-timer/tests --testTimeout=90000 --hookTimeout=90000

      - name: Test packaged package manager
        run: pnpm exec vitest run scripts/desktop-package-manager.spec.ts --testTimeout=90000 --hookTimeout=90000

      - name: Test desktop TypeScript surfaces
        run: pnpm run desktop:test

      - name: Test native host
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Test packaged Profile startup and failed activation recovery
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml packaged_profile_selection_and_recovery -- --ignored

      - name: Verify packaged local-agent opt-ins
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml packaged_provider_and_preset_smoke -- --ignored

      - name: Verify packaged agent execution runtimes without account access
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml packaged_agent_versions_without_host_cli_or_user_credentials -- --ignored --nocapture

      - name: Verify packaged Skill installation lifecycle
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml packaged_skill_lifecycle -- --ignored

      - name: Build desktop installers
        if: runner.os != 'Windows'
        run: pnpm --filter @deepseek-ai/dsh-desktop-app run tauri:build

      - name: Build desktop installer from a short Windows path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop'
          $shortRoot = Join-Path $env:RUNNER_TEMP "dsh-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $shortRoot | Out-Null

          robocopy $source $shortRoot /E /R:2 /W:1 /XD `
            (Join-Path $source 'node_modules') `
            (Join-Path $source '.runtime-cache') `
            (Join-Path $source 'src-tauri\target')
          if ($LASTEXITCODE -ge 8) {
            throw "robocopy failed with exit code $LASTEXITCODE"
          }

          Push-Location $shortRoot
          & (Join-Path $source 'node_modules\.bin\tauri.cmd') build
          $buildExit = $LASTEXITCODE
          Pop-Location
          if ($buildExit -ne 0) {
            throw "tauri build failed with exit code $buildExit"
          }

          $artifactDir = Join-Path $source 'src-tauri\target\release\bundle\nsis'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item (Join-Path $shortRoot 'src-tauri\target\release\bundle\nsis\*.exe') $artifactDir

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified desktop installers
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: harness-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish installers and checksums
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          macos=(*.dmg)
          windows=(*.exe)
          test "${#macos[@]}" -eq 1
          test "${#windows[@]}" -eq 1
          # Match GitHub's uploaded asset names before generating the checksum manifest.
          for file in "${macos[@]}" "${windows[@]}"; do
            normalized="${file// /.}"
            if [[ "$file" != "$normalized" ]]; then mv -- "$file" "$normalized"; fi
          done
          macos=(*.dmg)
          windows=(*.exe)
          sha256sum "${macos[@]}" "${windows[@]}" > SHA256SUMS
          version="${RELEASE_TAG#desktop-v}"
          options=()
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          notes="Community desktop preview, not an official DeepSeek release. macOS Apple Silicon: ad-hoc signed, not notarized. Windows x64: unsigned. Review the source and SHA256SUMS before approving installation. Automatic updates are not configured. Bundled Harness version: $version."
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" --verify-tag --generate-notes \
            --notes "$notes" \
            --title "Qabas $version" "${options[@]}" \
            "${macos[@]}" "${windows[@]}" SHA256SUMS
