name: Qabas engine
on:
  pull_request:
    paths: ['engine/**', '.github/workflows/engine.yml']
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install real PDF tools used by the engine tests
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - run: python -m pip install -r engine/requirements.txt -r engine/requirements-dev.txt
      - run: python -m unittest discover -s tests -t tests -v
        working-directory: engine
        env:
          TRANSCRIBER_AGY: 'off'
      - run: python -m pytest tests
        working-directory: engine
      - run: python -m ruff check .
        working-directory: engine
      - run: python -m mypy
        working-directory: engine
