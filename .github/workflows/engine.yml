name: Qabas engine
on:
  pull_request:
    paths: ['engine/**', '.github/workflows/engine.yml']
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install real PDF and audio tools used by the engine tests
        run: |
          if ! command -v pdftoppm >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
            sudo apt-get install -y poppler-utils ffmpeg
          fi
          pdftoppm -v
          ffmpeg -version
      - run: python -m pip install -r engine/requirements.txt -r engine/requirements-dev.txt
      - run: python -m unittest discover -s tests -t tests -v
        working-directory: engine
        env:
          TRANSCRIBER_AGY: 'off'
      - run: python -m pytest tests
        working-directory: engine
      - run: python -m ruff check .
        working-directory: engine
      - run: python -m mypy
        working-directory: engine
