# Mount the app-owned MCP engine through the shipped Web profile:
#   pnpm dsh --profile web --patch engine/transcriber.cordis.yml
# The Host API resolves engine overrides, source/frozen launchers and ~/qabas/Qabas Library.
# TRANSCRIBER_WORKSPACE is the developer override; saved folder selections are ignored.
- insert:
    - id: universal-transcriber
      name: '@deepseek-ai/dsh-mcp-client'
      inject: [transcriberEngine]
      config: !!js >
        (() => {
          const { argv, cwd } = ctx.transcriberEngine.mcpCommand;
          return {
            serverName: 'transcriber', transport: 'stdio',
            command: argv[0], args: argv.slice(1), cwd,
            toolCallTimeoutMs: 10800000
          };
        })()
